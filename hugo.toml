baseURL = "https://decuma.de/"
title = "Decuma"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
uglyURLs = true
disableAliases = true
disableDefaultLanguageRedirect = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[params]
app = "https://app.decuma.de"
booking = "https://cal.com/decuma-raphael/30min"
repo = "https://github.com/rapha-red/open-decuma"
# the "Für:" row of the Produkt menu and the footer column "Lösungen für"; on once the "Lösungen für" pages exist
menu_fuer = false
# the "Lösungen für" pages: address slug and label key (w.m.fuer.<key>), in the menu row and the footer column
fuer = [["gmbh", "gmbh"], ["ug", "ug"], ["holding", "holding"], ["freiberufler", "frei"], ["selbststaendige", "selbst"], ["entwickler", "dev"]]

[languages.de]
weight = 1
locale = "de-DE"
[languages.en]
weight = 2
locale = "en-GB"

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true
[outputFormats.sitemapxml]
mediaType = "application/xml"
baseName = "sitemap"
isPlainText = true
notAlternative = true

[minify.tdewolff.html]
keepDocumentTags = true
keepEndTags = true
keepQuotes = true

# plain Markdown links (the built-in link hook escapes tel: in the Impressum)
[markup.goldmark.renderHooks.link]
useEmbedded = "never"
