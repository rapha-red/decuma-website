"w.bp.sammler": "Fetches invoices from your mailbox and from your customer accounts with suppliers, reads them and matches them to the payment. When a Beleg is missing, it drafts the request to the supplier."
"w.bp.sub": "A bot takes on one job and stays on it: collecting Belege, matching payments, reminding customers, preparing the VAT return. Whatever needs your approval, it brings to you."
