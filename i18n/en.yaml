"w.p.sub": "Bookkeeping, invoices and the VAT return are free. Pro comes in when you close the year, want to automate more or bring your team. One price per business, the same for every legal form."
"w.p.title": "Pricing: Free, Pro and Max | Decuma"
"w.p.under": "The introductory price applies to new customers on monthly billing, once per payment method. All prices plus VAT, except Privat."
"w.p.view": "View"
"w.r.dev": "For developers"
"w.r.dev.l": "API, CLI, MCP and SDKs. Everything the app can do, your code can do."
"w.r.neu": "New in Decuma"
"w.r.neu.l": "What changed, one line per release."
"w.r.os": "Open source"
"w.r.os.karte": "Your server, your data, your rules."
"w.r.os.l": "Self-host, read the code, check the rules."
"w.r.vs": "Data promise"
"w.r.vs.l": "Where your data are and who processes them."
"w.r.wissen": "Knowledge Base"
"w.r.wissen.l": "Tax and bookkeeping in plain sentences, every rule with its source."
"w.s.a1": "For the self-employed, freelancers and traders, for GmbH, UG and holdings and for partnerships in Germany. And for private individuals who want to do their income tax return."
"w.s.a10": "Yes. Decuma calculates the VAT return from your bookings, shows you every Kennzahl with the bookings behind it and reminds you of the deadline: filing and payment on the 10th day after the end of the month or quarter, one month later with a permanent extension. It is filed only after your release."
"w.s.a2": "No, just what matters. What Decuma recognises for certain it books by your rules. Where something is unclear it asks you a short question. And you release every filing to the tax office yourself."
"w.s.a3": "Yes. After your release Decuma transmits the filing for you, without you needing an ELSTER certificate of your own. If you'd rather send it yourself, you can."
"w.s.a3.fb": "Decuma prepares every filing completely. You upload the file to Mein ELSTER or transfer the values with the input sheet. If you use an AI assistant on your computer, it can fill in Mein ELSTER there for you."
"w.s.a4": "Yes. Decuma supports MCP, the open standard through which ChatGPT, Claude and other AI assistants work with other software. You connect your Decuma once and then ask in the chat about open invoices, have Belege captured or an invoice prepared. Anything that goes to the tax office or moves money you release yourself."
"w.s.a5": "Yes. Decuma writes and reads e-invoices as XRechnung and ZUGFeRD. You can export your books in the DATEV format, for your accounting firm for example, and when you switch, bring them in from the DATEV format."
"w.s.a6": "Decuma is software, not tax advice. With Decuma you do your bookkeeping and taxes yourself. Questions that depend on your case are flagged for you, never decided by the software. If you like, you invite your advisor; their review note is recorded on the filing. And if you want us to do the bookkeeping for you: Done-for-you."
"w.s.a7": "Your data are on servers in Germany and belong to you; you can export all of them at any time. No model is trained on your data. Who processes data on our behalf, we tell you on request."
"w.s.a8": "Decuma's code is public, under the AGPL-3.0. You can read it, audit it and run it on your own server, free of charge and without artificial limits."
"w.s.a9": "The day-to-day bookkeeping, from the Beleg to the booking: reading Belege, matching payments, writing invoices and keeping track of them. From that Decuma prepares the VAT return, and at year end the annual accounts and the annual returns. You release."
"w.s.ag.cta": "See Decuma Bots"
"w.s.ag.eyebrow": "Agent"
"w.s.ag.h": "A colleague for the small stuff."
"w.s.ag.t": "The agent collects Belege, settles open cases, chases missing Belege, matches the bank and prepares every filing until it is ready for release. Each morning you get a short report, whenever there is something to report."
"w.s.ag.t2": "It works with the same rights as the app and under your approval policy. Only you can release."
"w.s.contrast": "The tax office wants your numbers. Not your Sunday."
"w.s.cta2": "See pricing"
"w.s.dev.cta": "For developers"
"w.s.dev.h": "Everything the app can do, your code can do too."
"w.s.dev.t": "Every feature of Decuma is first a command in the API. The app is just one client among many: your script, your automation or your own AI assistant over MCP are the others."
"w.s.dfy.cta": "How Done-for-you works"
"w.s.dfy.h": "Rather not do it yourself? We do your day-to-day bookkeeping."
"w.s.dfy.l1": "Day-to-day bookkeeping and chart of accounts"
"w.s.dfy.l1.lohn": "Day-to-day bookkeeping, chart of accounts and payroll if you like"
"w.s.dfy.l2": "Migration from DATEV, lexoffice, sevdesk or spreadsheets, months left undone booked"
"w.s.dfy.l3": "Rules, integrations and your own server if you like"
"w.s.dfy.preis": "A fixed offer after a 30-minute call."
"w.s.dfy.t": "Our bookkeepers book your current transactions from your Belege, months left undone included, and set up your chart of accounts. The VAT return, the opening balance sheet, the annual accounts and the tax returns you do yourself with Decuma or with your tax adviser; a finished VAT return we send for you."
"w.s.end.h": "Try it with your own business."
"w.s.eyebrow": "For GmbH, UG, freelancers and the self-employed"
"w.s.f1": "E-invoicing with XRechnung and ZUGFeRD"
"w.s.f2": "Bookings are never overwritten"
"w.s.f3": "Servers in Germany"
"w.s.f4": "No trackers"
"w.s.f5": "Open source, AGPL-3.0"
"w.s.h1": "Bookkeeping that runs itself"
"w.s.ok.h": "You keep the final say."
"w.s.ok.t": "No filing goes to the tax office before someone from your business releases it. The release covers exactly the numbers you saw."
"w.s.ok.t2": "Every step is in the history, with its reason and its author. Decuma's steps too."
"w.s.os.cta": "Self-host"
"w.s.os.eigen": "Your server|Your data|Your rules"
"w.s.os.gh": "View on GitHub"
"w.s.os.h": "The code is open. Your data stay where you want them."
"w.s.os.t": "Decuma is open source. Run it on your own server and your books never leave your house. Alternatively, we can set it up and run it for you. Either way you can read the rules Decuma computes with, each with its source in the law."
"w.s.pr.cta": "All prices"
"w.s.pr.h": "Pricing"
"w.s.pr.netto": "plus VAT"
"w.s.pr.t": "Bookkeeping, invoices, the VAT return and the Zusammenfassende Meldung are free. Pro comes in when you close the year, want to automate more or bring your team: {{ .pro }} a month, the first {{ .n }} months {{ .intro }}."
"w.s.q1": "Who is Decuma for?"
"w.s.q10": "Can Decuma prepare the VAT return directly?"
"w.s.q2": "Do I still have to check everything?"
"w.s.q3": "Does Decuma file with the tax office?"
"w.s.q4": "Can I use Decuma directly in ChatGPT or Claude?"
"w.s.q5": "Does Decuma work with e-invoices and DATEV?"
"w.s.q6": "Does Decuma replace my accounting firm?"
"w.s.q7": "Are my data safe?"
"w.s.q8": "What does open source mean at Decuma?"
"w.s.q9": "What does Decuma take off my plate?"
"w.s.r1.h": "Photo in, booking out."
"w.s.r1.h.fb": "One place for every Beleg."
"w.s.r1.t": "Photograph the Beleg, drop in the PDF or forward the e-mail. Decuma reads amount, date, tax rate and supplier, proposes the booking and only asks when something is unclear."
"w.s.r1.t.fb": "Photograph the Beleg, drop in the PDF or forward the e-mail. Every Beleg is stored unchanged, linked to its booking and found again in seconds."
"w.s.r2.bank": "Or connect your account and the transactions arrive by themselves."
"w.s.r2.h": "Every payment finds its Beleg."
"w.s.r2.t": "Import the statement and you're done: Decuma matches payments to their invoices and Belege by amount, reference and partner. Whatever stays open, you see at a glance."
"w.s.r3.h": "E-invoicing without thinking about it."
"w.s.r3.t": "Write the invoice as usual. Decuma produces XRechnung or ZUGFeRD, sends it by e-mail and reads the e-invoices you receive. Since 2025 every business in Germany must be able to receive e-invoices."
"w.s.r4.h": "The tenth comes every month. Your VAT return is ready by then."
"w.s.r4.t": "Every Kennzahl comes from your bookings, one click down to the Beleg. You check, release and upload the file to Mein ELSTER."
"w.s.r4.t.auftrag": "Every Kennzahl comes from your bookings, one click down to the Beleg. You check and release, Decuma transmits for you."
"w.s.r4.t.eric": "Every Kennzahl comes from your bookings, one click down to the Beleg. You check, release and transmit with your own ELSTER certificate."
"w.s.r5.h": "Twelve months of bookings. A year-end that follows from them."
"w.s.r5.link": "More on year-end"
"w.s.r5.t": "Fixed asset register, closing entries, Bilanz and GuV under the HGB, plus Körperschaft- and Gewerbesteuer. Decuma shows you beforehand what is still missing."
"w.s.so.1": "Create an account and enter your business."
"w.s.so.2": "Snap or forward your Belege, import your bank statement."
"w.s.so.3": "Decuma books and prepares every filing."
"w.s.so.4": "You take a look and release."
