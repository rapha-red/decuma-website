"w.bp.a1": "In the chat you ask, and Decuma answers or gets something done for you. A bot acts without being asked: it has a fixed job and works when something happens, such as a new Beleg, a bank transaction or an approaching deadline."
"w.bp.a2": "Not on its own. It prepares payments and filings and brings them to you for release. Only someone from your business can release them."
"w.bp.a3": "Yes. You describe in your own words what should get done, and Decuma sets up a bot from it. You check its job, rhythm and approval rules before it starts."
"w.bp.a4": "It asks you, with a short question and answers to tap."
"w.bp.a5": "No. A bot acts when a Beleg arrives, a bank transaction comes in, a deadline gets close or its rhythm says so. It never invents work."
"w.bp.a6": "In the history, every step with its reason and time, and every morning in the short report."
"w.bp.bericht.h": "A short report every morning"
"w.bp.bericht.t": "What the bots did and what needs you, in one report. When there is nothing to report, none arrives."
"w.bp.bsp.h": "Bots for the small stuff"
"w.bp.bsp.l": "Four examples many people start with. Which bots you need is up to you."
