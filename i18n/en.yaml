"w.p.a1": "Yes, with no trial period and no credit card. The limits are deliberately tight: {{ .belege }} Belege a month, {{ .mb }} MB, one business, one person. A business on Free without sign-in is deleted after {{ .monate }} months, announced twice by e-mail beforehand."
"w.p.a10": "{{ .n }} per filed return, VAT included, charged at the release. For the self-employed on Pro or Max with yearly billing, the own return is included."
"w.p.a11": "Yes. Decuma is open source under the AGPL-3.0. You pay only for your server. No artificial limits; AI features you connect through your own provider."
"w.p.a12": "Bookkeeping, invoices and taxes on one platform for the self-employed, businesses and private individuals in Germany. Decuma books, writes invoices and prepares the VAT return and the annual returns; you release. Private individuals do their income tax return with Decuma."
"w.p.a13": "No. You sign up with your e-mail address and use Free without payment details. You add a payment method only when you move to Pro or Max."
"w.p.a14": "Yes. You can cancel every month and switch from monthly to yearly at any time; the yearly price applies from the switch, and what you already paid for the current month is credited. If you cancel, your business falls back to Free and your data stay."
"w.p.a16": "If you use Decuma for your business, the price is a business expense, since business expenses are the costs caused by the business (§ 4 Abs. 4 EStG)."
"w.p.a17": "Yes, in two ways. Yourself: with Pro or Max on yearly billing you move your data free of charge, book the year from your Belege and do the EÜR or annual accounts and the returns in Decuma, at no extra cost. Or with Done-for-you: our team books the year’s transactions from your Belege. The EÜR, annual accounts and returns you then do with Decuma or with your tax adviser."
"w.p.a2": "The regular price: Pro {{ .pro }}, Max {{ .agent }} a month. You can cancel every month."
"w.p.a2.pro": "The regular price: Pro {{ .pro }} a month. You can cancel every month."
"w.p.a4": "Your business falls back to Free, your data stay. What goes beyond Free you can still read and export, but not continue."
"w.p.a5": "It reads your Belege, proposes bookings and phrases hints; in Max the agent and Decuma Bots work with it. Every plan includes a monthly AI credit, Pro more than Free and Max the most. You see what you have used in the app, and on Pro and Max you can top up."
"w.p.a8": "Each business has its own plan. One of them can run on Free, every further one needs Pro or Max. Anyone working for several businesses, for example as an advisor, pays nothing for their own access."
"w.p.a9": "No. Pro and Max include up to {{ .n }} people per business at no extra cost. In Free you work alone."
