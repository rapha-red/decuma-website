"w.d.w1": "Day-to-day bookkeeping"
"w.d.w1.t": "We set up your chart of accounts, on SKR03 or SKR04, and book your Belege and bank transactions month by month in your Decuma."
"w.d.w2": "Invoices and open items"
"w.d.w2.t": "We write your invoices, keep track of open items and remind customers who pay late, as you specify."
"w.d.w3": "Payroll"
"w.d.w3.t": "The monthly payroll for you and your team and the Lohnsteuer-Anmeldung, every month."
"w.d.w4": "Migration"
"w.d.w4.t": "Your books move from DATEV, lexoffice, sevdesk or spreadsheets to Decuma: chart of accounts, open items and Belege."
"w.d.w5": "Catch-up"
"w.d.w5.t": "We book the months left undone from your Belege until your books are up to date."
"w.d.w6": "Rules and integrations"
"w.d.w6.t": "Rules for your recurring cases, tested against your real bookings; shop, bank and your systems connected."
"w.d.w7": "Self-hosting"
"w.d.w7.t": "If you like, we install Decuma on your server or in your cloud, with backups, mail and Beleg storage."
"w.d.w8": "Sending the VAT return"
"w.d.w8.t": "The VAT return, the annual accounts and the tax returns you do yourself with Decuma or with your tax adviser; they see your books in Decuma. A finished VAT return we send for you."
"w.d.w9": "Catching up earlier years"
"w.d.w9.t": "Is a year still unbooked? Our team books its transactions from your Belege. The EÜR, accounts and returns stay with you in Decuma or with your tax adviser."
"w.d.yours.h": "Your books stay yours."
"w.d.yours.t": "We work in your Decuma, not in a system of ours. If our work ends, everything keeps running in your plan: rules, integrations, automations. Nothing is switched off. You release filings to the tax office yourself."
"w.dv.anfrage": "You get the list of sub-processors and their locations on request."
"w.dv.kontakt": "Request it"
