"w.d.a1": "A call and the export from your current software or your spreadsheets. After that you forward your Belege, or Decuma fetches them from your mailbox, and we book them."
"w.d.a2": "It depends on your books. After the call you get a written offer with a fixed scope and a fixed price. No timesheets."
"w.d.a3": "We do your day-to-day bookkeeping. The VAT return, the opening balance sheet, the annual accounts and the tax returns you do yourself with Decuma or with your tax adviser; the figures are already in your books. A finished VAT return we send for you."
"w.d.a4": "You, the people you grant access to, and the small team that runs your bookkeeping. Every step is in the history, with a name."
"w.d.a6": "Yes. We install and set up, you operate. Your data stay on your server, also while we work, if you give us access there."
"w.d.a7": "Yes, gladly and closely. You invite them into your Decuma, then they see the same numbers as we do, and their review note is recorded. If they work with DATEV, they get your books in the DATEV format."
"w.d.a8": "We work that out in the call; the offer says by when."
"w.d.contrast": "The bookkeeping has to get done. It doesn't have to be done by you."
"w.d.cross": "Rather do it yourself?"
"w.d.cross.a": "To the plans"
"w.d.end.h": "In a short call we work out what you need. Then you get a binding offer."
"w.d.end.line": "Done-for-you is bookkeeping, not tax advice."
