"pr.a1": "The regular price: Pro {{ .pro }}, Agent {{ .agent }} per month. You can cancel every month."
"pr.a2": "Yes, at any time. The yearly price applies from the switch. What you already paid for the current month is credited."
"pr.a4": "The Mandant falls back to Kostenlos, your data stay. What goes beyond Kostenlos you can still read and export, but not continue."
"pr.a5": "AI features cost computing time. Every action is deducted from the KI-Guthaben at the model provider's list price plus 20%, in cents and traceable one by one. The monthly amount is refilled every month. You can top up in steps of {{ .steps }}. When it is empty, Decuma keeps working without AI."
"pr.a6": "Nothing extra. While you are on yearly billing you can also prepare returns for earlier years."
"pr.a7": "An annual return sums up a whole year. While you are on yearly billing the annual returns are included, for the self-employed including their own Einkommensteuererklärung. Ongoing Meldungen also work on monthly billing."
