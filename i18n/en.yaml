"w.faq": "Frequently asked questions"
"w.g.a1": "The information about your new business the tax office requires after founding: what you do, where, with which bank, what revenue and profit you expect and whether you have staff. From it, the tax office assigns your tax number and sets prepayments."
"w.g.a2": "Within one month of opening the business. Decuma puts the deadline in your calendar as soon as you enter the date."
"w.g.a3": "Only on request in special hardship cases. The normal case is electronic."
"w.g.a4": "Yes, that's exactly what the questionnaire is for: in it you apply for the new tax number at the tax office for the place your business is managed from."
"w.g.a5": "The first Bilanz of your GmbH or UG, drawn up at the start. Yes, it goes to the tax office electronically as an E-Bilanz; if the tax number isn't there yet, the tax office's number is enough. It cannot be uploaded through Mein ELSTER."
"w.g.a6": "You decide; Decuma shows you the consequences. In the founding year your actual turnover of the year counts, against the €25,000 limit. As a Kleinunternehmer you charge no VAT and deduct no input VAT. If you opt out, you are bound for at least five years."
"w.g.a7": "You can apply for it in the questionnaire. It is issued by the Federal Central Tax Office once the tax office has registered you; it arrives by post."
"w.g.a8": "If you run a trade: yes, with your municipality, at the same time as you start. The trade registration doesn't replace the questionnaire; you need both."
"w.g.a9": "Nobody from Decuma. You transmit as yourself, and every entry comes from you. If you have an advisor, you can enter them."
"w.g.ab.ende": "Done. After your release both go to the tax office."
"w.g.ab.ende.fb": "Done. You send the questionnaire in Mein ELSTER."
