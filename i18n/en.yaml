"w.bp.eigen.name": "Friday list of open invoices"
"w.bp.eigen.prompt": "Every Friday, check which customers have not paid their invoice for more than 14 days, and give me a list with a draft reminder."
"w.bp.eigen.t": "Describe what should get done, the way you would tell someone on your team. Decuma turns it into a bot with a job, a rhythm and approval rules."
"w.bp.eigen.t2": "You check the draft, change what does not fit and switch it on. It works with the same rights as the app and stops wherever your approval is needed."
"w.bp.eigen.takt.v": "Fridays at 9:00"
"w.bp.end.h": "Try it with your own business."
"w.bp.frist": "Prepares the VAT return until it is ready for release and tells you in good time before the deadline what is still missing."
"w.bp.h1": "Bots that do your bookkeeping while you work."
"w.bp.ja.h": "You decide what a bot may do alone."
"w.bp.ja.label": "The approval policy: what a bot may do alone and what it asks about"
"w.bp.ja.t": "For each kind of action you set whether a bot does it alone, asks you first or never does it."
"w.bp.ja.t2": "Two things no bot does alone: moving money and sending anything to the tax office. For those it always needs the release of someone from your business. Every step is in the history with its reason, and you can pause each bot on its own, at any time."
"w.bp.kontierer": "Matches every new bank transaction and books it by your rules. When no rule fits, it asks you."
