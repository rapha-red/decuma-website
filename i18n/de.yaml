"w.bp.ja.label": "Die Freigaberichtlinie: was ein Bot allein darf und wofür er fragt"
"w.bp.ja.t": "Für jede Art von Aktion stellst du ein, ob ein Bot sie allein ausführt, dich vorher fragt oder nie tut."
"w.bp.ja.t2": "Zwei Dinge tut kein Bot allein: Geld bewegen und etwas ans Finanzamt schicken. Dafür braucht er immer die Freigabe von jemandem aus deinem Unternehmen. Jeder Schritt steht mit seinem Grund im Verlauf, und anhalten kannst du jeden Bot einzeln, jederzeit."
