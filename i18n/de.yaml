"w.g.eb.line.fb": "Für die Übermittlung brauchst du eine Software mit ERiC-Anbindung; Decuma gibt dir die Datei dafür."
"w.g.eb.t": "Eine GmbH oder UG stellt zu Beginn eine Eröffnungsbilanz auf und übermittelt sie elektronisch als E-Bilanz. Decuma stellt sie aus deinem Stammkapital und den ersten Buchungen auf."
