"w.p.title": "Preise: Kostenlos, Pro und Max | Decuma"
"w.p.under": "Der Einstiegspreis gilt für neue Kunden bei monatlicher Abrechnung, einmal je Zahlungsmittel. Alle Preise zzgl. USt., außer Privat."
"w.p.view": "Ansicht"
