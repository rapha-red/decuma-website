"w.bp.eigen.prompt": "Schau jeden Freitag, welche Kunden ihre Rechnung seit mehr als 14 Tagen nicht bezahlt haben, und leg mir eine Liste mit einem Entwurf für die Erinnerung hin."
"w.bp.eigen.t": "Beschreib, was erledigt werden soll, so wie du es jemandem im Team sagen würdest. Decuma macht daraus einen Bot mit Aufgabe, Rhythmus und Freigaberegeln."
"w.bp.eigen.t2": "Du prüfst den Entwurf, änderst, was nicht passt, und schaltest ihn ein. Er arbeitet mit denselben Rechten wie die App und hält überall an, wo deine Freigabe nötig ist."
"w.bp.eigen.takt.v": "freitags um 9:00"
"w.bp.end.h": "Probier es mit deinem Unternehmen aus."
"w.bp.frist": "Bereitet die Umsatzsteuer-Voranmeldung vor, bis sie freigabebereit ist, und sagt dir rechtzeitig vor der Frist, was noch fehlt."
"w.bp.h1": "Bots, die deine Buchhaltung erledigen, während du arbeitest."
