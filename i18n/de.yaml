"q.b14.nein": "Nein, ein anderer"
"q.b14.text": "Ist das derselbe Beleg?"
"q.b14.why": "Aussteller, Rechnungsnummer, Datum und Betrag stimmen mit einem Beleg überein, den es schon gibt. Die Datei ist eine andere. Decuma lehnt nichts ab und legt nichts von selbst zusammen: Bei „Ja“ bleibt die Datei abgelegt und wird nicht noch einmal gebucht, bei „Nein“ ist es ein eigener Beleg mit eigenem Vorschlag."
