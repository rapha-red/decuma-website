"w.g.gw.h": "Gewerbe anmelden"
"w.g.gw.line": "Ob deine Tätigkeit ein Gewerbe ist, hängt von deinem Fall ab. Decuma markiert die Frage, entscheiden kann sie die Software nicht."
"w.g.gw.t": "Ein Gewerbe meldest du bei deiner Gemeinde an, gleichzeitig mit dem Start. Die Gewerbeanmeldung ersetzt den Fragebogen nicht. Decuma sagt dir, was du dafür brauchst, und trägt den Termin in deinen Kalender."
