"w.p.a1": "Ja, ohne Testzeitraum und ohne Kreditkarte. Die Grenzen sind bewusst eng: {{ .belege }} Belege im Monat, {{ .mb }} MB, ein Unternehmen, eine Person. Ein Unternehmen auf Kostenlos ohne Anmeldung löschen wir nach {{ .monate }} Monaten, nachdem wir es zweimal per E-Mail angekündigt haben."
"w.p.a10": "{{ .n }} je abgegebener Erklärung, inklusive Umsatzsteuer, berechnet bei der Freigabe. Für Selbstständige in Pro oder Max mit jährlicher Abrechnung ist die eigene Erklärung enthalten."
"w.p.a11": "Ja. Decuma ist Open Source unter der AGPL-3.0. Du zahlst nur deinen Server. Ohne künstliche Grenzen; KI-Funktionen schließt du über deinen eigenen Anbieter an."
"w.p.a12": "Buchhaltung, Rechnungen und Steuern in einer Plattform für Selbstständige, Unternehmen und Privatpersonen in Deutschland. Decuma bucht, schreibt Rechnungen und bereitet die Umsatzsteuer-Voranmeldung und die Jahreserklärungen vor; du gibst frei. Privatpersonen machen mit Decuma ihre Einkommensteuererklärung."
"w.p.a13": "Nein. Du registrierst dich mit deiner E-Mail-Adresse und nutzt Kostenlos ohne Zahlungsdaten. Eine Zahlungsart hinterlegst du erst, wenn du zu Pro oder Max wechselst."
"w.p.a14": "Ja. Du kannst jeden Monat kündigen und jederzeit von monatlich auf jährlich wechseln; ab dem Wechsel gilt der Jahrespreis, und was du im laufenden Monat schon bezahlt hast, rechnen wir an. Kündigst du, fällt dein Unternehmen auf Kostenlos zurück, und deine Daten bleiben."
"w.p.a16": "Nutzt du Decuma für dein Unternehmen, ist der Preis eine Betriebsausgabe, denn Betriebsausgaben sind die Aufwendungen, die durch den Betrieb veranlasst sind (§ 4 Abs. 4 EStG)."
"w.p.a17": "Ja, auf zwei Wegen. Selbst: Mit Pro oder Max bei jährlicher Abrechnung ziehst du deine Daten kostenlos um, buchst das Jahr aus deinen Belegen nach und machst EÜR oder Jahresabschluss und die Erklärungen in Decuma, ohne Aufpreis. Oder mit Done-for-you: Unser Team bucht die Geschäftsvorfälle des Jahres aus deinen Belegen. EÜR, Jahresabschluss und Erklärungen machst du dann mit Decuma oder mit deinem Steuerberater."
"w.p.a2": "Den normalen Preis: Pro {{ .pro }}, Max {{ .agent }} im Monat. Du kannst jeden Monat kündigen."
"w.p.a2.pro": "Den normalen Preis: Pro {{ .pro }} im Monat. Du kannst jeden Monat kündigen."
"w.p.a4": "Dein Unternehmen fällt auf Kostenlos zurück, deine Daten bleiben. Was über Kostenlos hinausgeht, kannst du weiter lesen und exportieren, aber nicht fortführen."
"w.p.a5": "Sie liest deine Belege, schlägt Buchungen vor und formuliert Hinweise; in Max arbeiten mit ihr der Agent und die Decuma Bots. Jeder Tarif enthält ein monatliches KI-Guthaben, Pro mehr als Kostenlos und Max am meisten. Was du verbraucht hast, siehst du in der App, und in Pro und Max kannst du aufladen."
"w.p.a8": "Jedes Unternehmen hat seinen eigenen Tarif. Eines davon kann auf Kostenlos laufen, jedes weitere braucht Pro oder Max. Wer für mehrere Unternehmen arbeitet, etwa als Berater, zahlt für seinen eigenen Zugang nichts."
"w.p.a9": "Nein. In Pro und Max sind bis zu {{ .n }} Personen je Unternehmen dabei, ohne Aufpreis. In Kostenlos arbeitest du allein."
