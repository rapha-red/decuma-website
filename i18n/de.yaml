"w.bp.a1": "Im Chat fragst du, und Decuma antwortet oder erledigt etwas für dich. Ein Bot wird tätig, ohne dass du fragst: Er hat eine feste Aufgabe und arbeitet, wenn etwas passiert, etwa ein neuer Beleg, ein Bankumsatz oder eine näher rückende Frist."
"w.bp.a2": "Nicht allein. Er bereitet Zahlungen und Meldungen vor und legt sie dir zur Freigabe vor. Freigeben kann nur jemand aus deinem Unternehmen."
"w.bp.a3": "Ja. Du beschreibst in deinen Worten, was erledigt werden soll, und Decuma legt daraus einen Bot an. Aufgabe, Rhythmus und Freigaberegeln prüfst du, bevor er startet."
"w.bp.a4": "Er fragt dich, mit einer kurzen Frage und Antworten zum Antippen."
"w.bp.a5": "Nein. Ein Bot wird tätig, wenn ein Beleg kommt, ein Bankumsatz, eine Frist näher rückt oder sein Rhythmus es vorsieht. Er erfindet keine Arbeit."
"w.bp.a6": "Im Verlauf, jeder Schritt mit Grund und Uhrzeit, und jeden Morgen im kurzen Bericht."
"w.bp.bericht.h": "Jeden Morgen ein kurzer Bericht"
"w.bp.bericht.t": "Was die Bots erledigt haben und was dich braucht, in einem Bericht. Gibt es nichts zu berichten, kommt auch keiner."
