"w.d.a1": "Ein Gespräch und den Export aus deiner bisherigen Software oder deine Tabellen. Danach leitest du uns deine Belege weiter, oder Decuma holt sie aus deinem Postfach, und wir buchen sie."
"w.d.a2": "Das hängt von deinen Büchern ab. Nach dem Gespräch bekommst du ein schriftliches Angebot mit festem Umfang und festem Preis. Keine Stundenzettel."
"w.d.a3": "Wir machen deine laufende Buchhaltung. Voranmeldung, Eröffnungsbilanz, Jahresabschluss und Steuererklärungen machst du mit Decuma selbst oder mit deinem Steuerberater; die Zahlen dafür stehen schon in deinen Büchern. Eine fertige Voranmeldung senden wir für dich."
"w.d.a4": "Du, die Personen, denen du einen Zugriff gibst, und das kleine Team, das deine Buchhaltung führt. Jeder Schritt steht mit Namen im Verlauf."
"w.d.a6": "Ja. Wir installieren und richten ein, du betreibst. Deine Daten bleiben auf deinem Server, auch während wir arbeiten, wenn du uns den Zugang dorthin gibst."
"w.d.a7": "Ja, gern und eng. Du lädst ihn in dein Decuma ein, dann sieht er dieselben Zahlen wie wir, und sein Prüfvermerk wird festgehalten. Arbeitet er mit DATEV, bekommt er deine Bücher im DATEV-Format."
"w.d.a8": "Das klären wir im Gespräch; im Angebot steht, bis wann."
"w.d.contrast": "Buchhaltung muss erledigt werden. Von dir muss sie nicht sein."
