"w.r.vs.l": "Wo deine Daten liegen und wer sie verarbeitet."
"w.r.wissen": "Knowledge Base"
"w.r.wissen.l": "Steuern und Buchhaltung in klaren Sätzen, jede Regel mit Quelle."
"w.s.a1": "Für Selbstständige, Freiberufler und Gewerbetreibende, für GmbH, UG und Holdings und für Personengesellschaften in Deutschland. Und für Privatpersonen, die ihre Einkommensteuererklärung machen wollen."
"w.s.a10": "Ja. Decuma rechnet die Umsatzsteuer-Voranmeldung aus deinen Buchungen, zeigt dir jede Kennzahl mit den Buchungen dahinter und erinnert dich an die Frist: Abgabe und Zahlung am 10. Tag nach Ablauf des Monats oder Quartals, mit Dauerfristverlängerung einen Monat später. Abgegeben wird sie erst nach deiner Freigabe."
"w.s.a2": "Nein, nur das, was zählt. Was Decuma sicher erkennt, bucht es nach deinen Regeln. Wo etwas unklar ist, stellt es dir eine kurze Frage. Und jede Meldung ans Finanzamt gibst du selbst frei."
"w.s.a3": "Ja. Nach deiner Freigabe übermittelt Decuma die Meldung für dich, ohne dass du ein eigenes ELSTER-Zertifikat brauchst. Wenn du lieber selbst sendest, geht das auch."
"w.s.a3.fb": "Decuma bereitet jede Meldung fertig vor. Du lädst die Datei in Mein ELSTER hoch oder überträgst die Werte mit dem Eingabeblatt. Nutzt du einen KI-Assistenten auf deinem Rechner, kann er Mein ELSTER dort für dich ausfüllen."
"w.s.a4": "Ja. Decuma unterstützt MCP, den offenen Standard, über den ChatGPT, Claude und andere KI-Assistenten mit anderen Programmen arbeiten. Du verbindest dein Decuma einmal und fragst dann im Chat nach offenen Rechnungen, lässt Belege erfassen oder eine Rechnung vorbereiten. Was ans Finanzamt geht oder Geld bewegt, gibst du selbst frei."
"w.s.a5": "Ja. Decuma schreibt und liest E-Rechnungen als XRechnung und ZUGFeRD. Deine Bücher kannst du im DATEV-Format exportieren, etwa für dein Steuerbüro, und wenn du wechselst, aus dem DATEV-Format übernehmen."
"w.s.a6": "Decuma ist eine Software und keine Steuerberatung. Mit Decuma machst du deine Buchhaltung und Steuern selbst. Fragen, die von deinem Fall abhängen, markiert Decuma für dich, entscheidet sie aber nicht. Wenn du magst, lädst du deinen Berater ein; sein Prüfvermerk wird an der Meldung festgehalten. Und wenn wir die Buchhaltung für dich machen sollen: Done-for-you."
"w.s.a7": "Deine Daten liegen auf Servern in Deutschland und gehören dir; du kannst sie jederzeit vollständig exportieren. Mit deinen Daten wird kein Modell trainiert. Wer in unserem Auftrag Daten verarbeitet, sagen wir dir auf Anfrage."
"w.s.a8": "Der Code von Decuma ist öffentlich, unter der AGPL-3.0. Du kannst ihn lesen, prüfen und auf deinem eigenen Server betreiben, kostenlos und ohne künstliche Grenzen."
"w.s.a9": "Die laufende Buchhaltung, vom Beleg bis zur Buchung: Belege lesen, Zahlungen zuordnen, Rechnungen schreiben und im Blick behalten. Daraus bereitet Decuma die Umsatzsteuer-Voranmeldung vor und am Jahresende den Jahresabschluss und die Jahreserklärungen. Du gibst frei."
"w.s.ag.cta": "Decuma Bots ansehen"
"w.s.ag.eyebrow": "Agent"
"w.s.ag.h": "Ein Kollege für die Kleinarbeit."
"w.s.ag.t": "Der Agent sammelt Belege ein, klärt offene Vorgänge, erinnert an fehlende Belege, gleicht die Bank ab und bereitet jede Meldung vor, bis sie freigabebereit ist. Jeden Morgen bekommst du einen kurzen Bericht, wenn es etwas zu berichten gibt."
"w.s.ag.t2": "Er arbeitet mit denselben Rechten wie die App und nach deiner Freigaberichtlinie. Freigeben kannst nur du."
"w.s.contrast": "Das Finanzamt will deine Zahlen. Nicht deinen Sonntag."
"w.s.cta2": "Preise ansehen"
"w.s.dev.cta": "Für Entwickler"
"w.s.dev.h": "Alles, was die App kann, kann auch dein Code."
"w.s.dev.t": "Jede Funktion von Decuma ist zuerst ein Befehl in der API. Die App ist nur einer von vielen Clients: dein Skript, deine Automatisierung oder dein eigener KI-Assistent über MCP sind die anderen."
"w.s.dfy.cta": "So läuft Done-for-you"
"w.s.dfy.h": "Lieber nicht selbst machen? Wir machen deine laufende Buchhaltung."
"w.s.dfy.l1": "Laufende Buchhaltung und Kontenplan"
"w.s.dfy.l1.lohn": "Laufende Buchhaltung, Kontenplan und auf Wunsch die Lohnabrechnung"
"w.s.dfy.l2": "Umzug aus DATEV, lexoffice, sevdesk oder Tabellen, liegengebliebene Monate nachgebucht"
"w.s.dfy.l3": "Regeln, Anbindungen und auf Wunsch dein eigener Server"
"w.s.dfy.preis": "Festes Angebot nach einem Gespräch von 30 Minuten."
"w.s.dfy.t": "Unsere Buchhalter buchen deine laufenden Geschäftsvorfälle, auch liegengebliebene Monate, aus deinen Belegen und richten deinen Kontenplan ein. Voranmeldung, Eröffnungsbilanz, Jahresabschluss und Steuererklärungen machst du mit Decuma selbst oder mit deinem Steuerberater; eine fertige Voranmeldung senden wir für dich."
"w.s.end.h": "Probier es mit deinem Unternehmen aus."
"w.s.eyebrow": "Für GmbH, UG, Freiberufler und Selbstständige"
"w.s.f1": "E-Rechnung mit XRechnung und ZUGFeRD"
"w.s.f2": "Buchungen werden nie überschrieben"
"w.s.f3": "Server in Deutschland"
"w.s.f4": "Keine Tracker"
"w.s.f5": "Open Source, AGPL-3.0"
"w.s.h1": "Buchhaltung von selbst"
"w.s.ok.h": "Du behältst das letzte Wort."
"w.s.ok.t": "Keine Meldung geht ans Finanzamt, bevor jemand aus deinem Unternehmen sie freigibt. Die Freigabe gilt genau für die Zahlen, die du gesehen hast."
"w.s.ok.t2": "Jeder Schritt steht im Verlauf, mit Grund und mit Namen. Auch die Schritte von Decuma."
"w.s.os.cta": "Selbst hosten"
"w.s.os.eigen": "Dein Server|Deine Daten|Deine Regeln"
"w.s.os.gh": "Auf GitHub ansehen"
"w.s.os.h": "Der Code liegt offen. Deine Daten bleiben, wo du willst."
"w.s.os.t": "Decuma ist Open Source. Betreib es auf deinem eigenen Server, dann verlassen deine Bücher nie dein Haus. Alternativ können wir es für dich aufsetzen und betreiben. Die Regeln, nach denen Decuma rechnet, kannst du in beiden Fällen lesen, jede mit ihrer Quelle im Gesetz."
"w.s.pr.cta": "Alle Preise"
"w.s.pr.h": "Preise"
"w.s.pr.netto": "zzgl. USt."
"w.s.pr.t": "Buchhaltung, Rechnungen, Voranmeldung und Zusammenfassende Meldung gibt es kostenlos. Pro kommt dazu, wenn du das Jahr abschließt, mehr automatisieren oder dein Team mitnehmen willst: {{ .pro }} im Monat, die ersten {{ .n }} Monate {{ .intro }}."
"w.s.q1": "Für wen ist Decuma?"
"w.s.q10": "Kann Decuma die UStVA direkt vorbereiten?"
"w.s.q2": "Muss ich trotzdem alles prüfen?"
"w.s.q3": "Übermittelt Decuma ans Finanzamt?"
"w.s.q4": "Kann ich Decuma direkt in ChatGPT oder Claude nutzen?"
"w.s.q5": "Arbeitet Decuma mit E-Rechnungen und DATEV?"
"w.s.q6": "Ersetzt Decuma mein Steuerbüro?"
"w.s.q7": "Sind meine Daten sicher?"
"w.s.q8": "Was heißt Open Source bei Decuma?"
"w.s.q9": "Was nimmt mir Decuma ab?"
"w.s.r1.h": "Foto rein, Buchung raus."
"w.s.r1.h.fb": "Ein Ort für jeden Beleg."
"w.s.r1.t": "Fotografiere den Beleg, zieh das PDF rein oder leite die Mail weiter. Decuma liest Betrag, Datum, Steuersatz und Lieferant, schlägt die Buchung vor und fragt nur, wenn etwas unklar ist."
"w.s.r1.t.fb": "Fotografiere den Beleg, zieh das PDF rein oder leite die Mail weiter. Jeder Beleg wird unverändert abgelegt, mit seiner Buchung verknüpft und ist in Sekunden wieder gefunden."
"w.s.r2.bank": "Oder verbinde dein Konto, dann kommen die Umsätze von selbst."
"w.s.r2.h": "Jede Zahlung findet ihren Beleg."
"w.s.r2.t": "Kontoauszug importieren, fertig: Decuma ordnet Zahlungen ihren Rechnungen und Belegen zu, nach Betrag, Verwendungszweck und Partner. Was offen bleibt, siehst du auf einen Blick."
"w.s.r3.h": "E-Rechnung, ohne darüber nachzudenken."
"w.s.r3.t": "Schreib die Rechnung wie immer. Decuma erzeugt XRechnung oder ZUGFeRD, schickt sie per Mail und liest E-Rechnungen, die du bekommst. Seit 2025 muss jedes Unternehmen in Deutschland E-Rechnungen empfangen können."
"w.s.r4.h": "Der Zehnte kommt jeden Monat. Deine Voranmeldung ist dann schon fertig."
"w.s.r4.t": "Jede Kennzahl kommt aus deinen Buchungen, mit einem Klick bis zum Beleg. Du prüfst, gibst frei und lädst die Datei in Mein ELSTER hoch."
"w.s.r4.t.auftrag": "Jede Kennzahl kommt aus deinen Buchungen, mit einem Klick bis zum Beleg. Du prüfst und gibst frei, Decuma übermittelt für dich."
"w.s.r4.t.eric": "Jede Kennzahl kommt aus deinen Buchungen, mit einem Klick bis zum Beleg. Du prüfst, gibst frei und übermittelst mit deinem eigenen ELSTER-Zertifikat."
"w.s.r5.h": "Zwölf Monate Buchungen. Ein Abschluss, der daraus folgt."
"w.s.r5.link": "Mehr zum Jahresabschluss"
"w.s.r5.t": "Anlagenverzeichnis, Abschlussbuchungen, Bilanz und GuV nach HGB, dazu Körperschaft- und Gewerbesteuer. Decuma zeigt dir vorher, was noch fehlt."
"w.s.so.1": "Konto anlegen und dein Unternehmen eintragen."
"w.s.so.2": "Belege fotografieren oder weiterleiten, Kontoauszug importieren."
"w.s.so.3": "Decuma bucht und bereitet jede Meldung vor."
"w.s.so.4": "Du schaust drauf und gibst frei."
"w.s.so.h": "So einfach geht’s"
