"w.faq": "Häufige Fragen"
"w.g.a1": "Die Auskunft über dein neues Unternehmen, die das Finanzamt nach der Gründung verlangt: was du tust, wo, mit welcher Bank, welche Umsätze und Gewinne du erwartest und ob du Mitarbeiter hast. Daraus vergibt es deine Steuernummer und setzt Vorauszahlungen fest."
"w.g.a2": "Innerhalb eines Monats nach der Betriebseröffnung. Decuma trägt die Frist in deinen Kalender, sobald du das Datum angibst."
"w.g.a3": "Nur auf Antrag in besonderen Härtefällen. Der Normalfall ist elektronisch."
"w.g.a4": "Ja, genau dafür ist der Fragebogen da: Du beantragst darin die neue Steuernummer bei dem Finanzamt, in dessen Bezirk dein Unternehmen geleitet wird."
"w.g.a5": "Die erste Bilanz deiner GmbH oder UG, aufgestellt zu Beginn. Ja, sie geht elektronisch als E-Bilanz ans Finanzamt; ist die Steuernummer noch nicht da, genügt die Nummer des Finanzamts. Über Mein ELSTER lässt sie sich nicht hochladen."
"w.g.a6": "Das entscheidest du; Decuma zeigt dir die Folgen. Im Gründungsjahr zählt dein tatsächlicher Umsatz des Jahres, mit der Grenze 25.000 €. Als Kleinunternehmer weist du keine Umsatzsteuer aus und ziehst keine Vorsteuer ab. Verzichtest du, bist du mindestens fünf Jahre gebunden."
"w.g.a7": "Du kannst sie im Fragebogen mit beantragen. Erteilt wird sie vom Bundeszentralamt für Steuern, sobald das Finanzamt dich erfasst hat; sie kommt per Post."
"w.g.a8": "Wenn du ein Gewerbe betreibst: ja, bei deiner Gemeinde, gleichzeitig mit dem Start. Die Gewerbeanmeldung ersetzt den Fragebogen nicht; beides ist nötig."
"w.g.a9": "Niemand von Decuma. Du übermittelst als du selbst, und jede Angabe kommt von dir. Hast du einen Berater, kannst du ihn eintragen."
"w.g.ab.ende": "Fertig. Nach deiner Freigabe geht beides ans Finanzamt."
"w.g.ab.ende.fb": "Fertig. Den Fragebogen sendest du in Mein ELSTER ab."
