"w.d.s2.t": "Fester Umfang, fester Preis, schriftlich. Keine Stundenzettel."
"w.d.s3": "Wir übernehmen"
"w.d.s3.t": "Unser Team arbeitet in deinem Decuma, mit einem eigenen Zugang, den du jederzeit entziehen kannst. Jeder Schritt steht mit Namen im Verlauf."
"w.d.spalte": "Möglichkeit zeigen"
"w.d.sub": "Unsere Buchhalter buchen deine laufenden Geschäftsvorfälle, auch liegengebliebene Monate, aus deinen Belegen und richten deinen Kontenplan ein. Voranmeldung, Eröffnungsbilanz, Jahresabschluss und Steuererklärungen machst du mit Decuma selbst oder mit deinem Steuerberater; eine fertige Voranmeldung senden wir für dich."
"w.d.take": "Was wir übernehmen"
"w.d.title": "Done-for-you: Wir machen deine Buchhaltung | Decuma"
"w.d.w1": "Laufende Buchhaltung"
"w.d.w1.t": "Wir richten deinen Kontenplan ein, nach SKR03 oder SKR04, und buchen deine Belege und Bankumsätze laufend in deinem Decuma."
"w.d.w2": "Rechnungen und offene Posten"
"w.d.w2.t": "Wir schreiben deine Rechnungen, behalten offene Posten im Blick und erinnern Kunden, die zu spät zahlen, nach deinen Vorgaben."
"w.d.w3": "Lohnabrechnung"
"w.d.w3.t": "Die laufende Lohnabrechnung für dich und dein Team und die Lohnsteuer-Anmeldung, jeden Monat."
"w.d.w4": "Umzug"
"w.d.w4.t": "Deine Bücher kommen aus DATEV, lexoffice, sevdesk oder Tabellen nach Decuma: Kontenplan, offene Posten und Belege."
"w.d.w5": "Aufholen"
"w.d.w5.t": "Liegengebliebene Monate buchen wir aus deinen Belegen nach, bis deine Bücher auf dem Stand von heute sind."
"w.d.w6": "Regeln und Anbindungen"
"w.d.w6.t": "Regeln für deine wiederkehrenden Fälle, getestet an deinen echten Buchungen; Shop, Bank und deine Systeme angebunden."
"w.d.w7": "Selbst hosten"
"w.d.w7.t": "Auf Wunsch installieren wir Decuma auf deinem Server oder in deiner Cloud, mit Sicherung, Mail und Belegablage."
"w.d.w8": "Voranmeldung senden"
"w.d.w8.t": "Voranmeldung, Jahresabschluss und Steuererklärungen machst du mit Decuma selbst oder mit deinem Steuerberater; er sieht deine Bücher in Decuma. Eine fertige Voranmeldung senden wir für dich."
"w.d.w9": "Vorjahre nachholen"
"w.d.w9.t": "Liegt ein Jahr noch ungebucht? Unser Team bucht seine Geschäftsvorfälle aus deinen Belegen. EÜR, Abschluss und Erklärungen bleiben bei dir in Decuma oder bei deinem Steuerberater."
"w.d.yours.h": "Deine Bücher bleiben deine."
"w.d.yours.t": "Wir arbeiten in deinem Decuma, nicht in einem System von uns. Endet die Zusammenarbeit, läuft alles in deinem Tarif weiter: Regeln, Anbindungen, Automatisierungen. Nichts wird abgeschaltet. Meldungen ans Finanzamt gibst du selbst frei."
