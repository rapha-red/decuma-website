"w.g.fb.h": "Fragebogen zur steuerlichen Erfassung"
"w.g.fb.t": "Wer ein Unternehmen gründet, teilt das dem Finanzamt innerhalb eines Monats mit diesem Fragebogen mit, elektronisch. Danach bekommst du deine Steuernummer. Decuma kennt die Fassungen für GmbH und UG sowie für Einzelunternehmen, auch Freiberufler."
