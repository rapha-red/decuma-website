"pr.a1": "Den normalen Preis: Pro {{ .pro }}, Agent {{ .agent }} im Monat. Du kannst jeden Monat kündigen."
"pr.a2": "Ja, jederzeit. Ab dem Wechsel gilt der Jahrespreis. Was du im laufenden Monat schon bezahlt hast, rechnen wir an."
"pr.a4": "Der Mandant fällt auf Kostenlos zurück, deine Daten bleiben. Was über Kostenlos hinausgeht, kannst du weiter lesen und exportieren, aber nicht fortführen."
"pr.a5": "KI-Funktionen kosten Rechenzeit. Jede Aktion wird zum Listenpreis des Modellanbieters plus 20 % vom Guthaben abgezogen, in Cent und einzeln nachvollziehbar. Das Monatsguthaben wird jeden Monat neu gefüllt. Aufladen kannst du in Schritten von {{ .steps }}. Ist es leer, arbeitet Decuma ohne KI weiter."
"pr.a6": "Nichts extra. Solange du jährlich zahlst, kannst du auch Erklärungen für frühere Jahre erstellen."
"pr.a7": "Eine Jahreserklärung fasst ein ganzes Jahr zusammen. Solange du jährlich zahlst, sind die Jahreserklärungen enthalten, für Selbstständige einschließlich der eigenen Einkommensteuererklärung. Laufende Meldungen gehen auch bei monatlicher Abrechnung."
