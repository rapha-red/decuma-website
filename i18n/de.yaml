"w.g.sub.fb": "Decuma führt dich durch den Fragebogen zur steuerlichen Erfassung und füllt ihn vor; du sendest ihn in Mein ELSTER ab. Die Eröffnungsbilanz stellt Decuma mit dir auf, mit der Datei für die E-Bilanz. Jede Entscheidung triffst du."
