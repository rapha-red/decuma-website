"w.bp.sammler": "Holt Rechnungen aus deinem Postfach und aus deinen Kundenkonten bei Lieferanten, liest sie und legt sie zur passenden Zahlung. Fehlt ein Beleg, entwirft er die Nachfrage an den Lieferanten."
